<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8e8">
<link rel="manifest" href="manifest.webmanifest">
<title>漢字クエスト</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#29251f;background:#fff8e8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px}
main{max-width:760px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}
h1{font-size:clamp(24px,5vw,34px);margin:0}
.panel{background:white;border:1px solid #eee1c9;border-radius:20px;padding:clamp(16px,4vw,26px);box-shadow:0 5px 18px #6b4b1710}
.label{font-size:14px;color:#88765e;margin-bottom:8px}
.prompt{font-size:clamp(27px,7vw,42px);font-weight:700;letter-spacing:.08em;min-height:1.5em}
button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:650;cursor:pointer}
.primary{background:#315e49;color:white;flex:1}.secondary{background:#f1eadc;color:#463b2d}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.grade-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
.grade{background:#f1eadc;color:#463b2d;min-height:68px;font-size:20px}
.grade small{display:block;font-size:12px;font-weight:400;margin-top:3px}
.canvas-wrap{margin-top:18px}
input.answer-input{display:block;width:100%;font-size:clamp(30px,8vw,48px);line-height:1.5;text-align:center;padding:16px;border:2px solid #dfd4c2;border-radius:14px;background:#fff;color:#29251f;outline:none;ime-mode:active}
input.answer-input:focus{border-color:#47785d;box-shadow:0 0 0 3px #47785d22}
.api-status{font-size:13px;color:#817565;min-height:1.4em;margin-top:8px}

.answer{margin-top:16px;padding:14px;background:#f3f7ef;border-radius:12px;display:none}
.answer strong{font-size:30px;margin-right:10px}
.note{font-size:13px;color:#817565;line-height:1.6;margin:14px 2px 0}
#practice,#result,#review{display:none}
#setup{display:block}
.count{font-size:14px;color:#766b5c}
.progress{height:9px;background:#eee8dc;border-radius:99px;overflow:hidden;margin:12px 0 18px}
.progress>div{height:100%;background:#47785d;width:0;transition:width .2s}
.feedback{display:none;margin-top:14px;padding:14px;border-radius:12px;background:#f3f7ef;line-height:1.7}
.feedback strong{font-size:28px}
.mark-actions button{flex:1}
.result-score{font-size:42px;font-weight:800;color:#315e49;margin:8px 0}
.result-list{display:grid;gap:8px;margin-top:16px}
.result-item{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:#f7f3eb;border-radius:10px}
.result-item .wrong{color:#a33}
.small{font-size:13px;color:#817565}
.page-title{font-size:24px;font-weight:750;margin:0 0 12px}
button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<main>
<header><h1>漢字クエスト</h1><div class="count" id="count"></div></header>
<section class="panel" id="setup">
  <div class="label">はじめに教えてね</div>
  <div class="prompt">何年生？</div>
  <p>選んだ学年までに習う漢字1,026字の中から、読みをランダムに出題するよ。</p>
  <div class="grade-grid" id="grades">
    <button class="grade" data-grade="1">小学1年生<small>1年生までの80字</small></button>
    <button class="grade" data-grade="2">小学2年生<small>2年生までの240字</small></button>
    <button class="grade" data-grade="3">小学3年生<small>3年生までの440字</small></button>
    <button class="grade" data-grade="4">小学4年生<small>4年生までの642字</small></button>
    <button class="grade" data-grade="5">小学5年生<small>5年生までの835字</small></button>
    <button class="grade" data-grade="6">小学6年生<small>6年生までの1,026字</small></button>
  </div>
  <p class="note">各学年の教育漢字を1字ずつ出題します。10問ごとに採点し、間違えた漢字だけ復習できます。</p>
</section>
<section class="panel" id="practice">
  <div class="label" id="modeLabel">この読みの漢字を書こう</div>
  <div class="prompt" id="prompt"></div>
  <div class="progress"><div id="progressBar"></div></div>
  <div class="canvas-wrap">
    <div class="label">答えを1字、Apple Pencilで書いてね</div>
    <input class="answer-input" id="writtenAnswer" type="text" lang="ja" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ここに漢字を書く" maxlength="4">
    <div class="api-status" id="inputHint">iPadでは入力欄にApple Pencilで書くと、手書き文字がテキストに変換されます。</div>
  </div>
  <div class="actions">
    <button class="secondary" id="clear">書きなおす</button>
    <button class="primary" id="check">答え合わせ</button>
  </div>
  <div class="feedback" id="feedback">
    <div class="small" id="judgeLabel">判定</div>
    <strong id="answerKanji"></strong>
    <p id="selfCheckText"></p>
    <div class="actions"><button class="primary" id="nextQuestion">次の問題へ</button></div>
  </div>
  <div class="actions"><button class="secondary" id="changeGrade">学年を選びなおす</button></div>
  <p class="note">※iPadOSの日本語手書き入力を使って文字に変換し、入力された漢字と正解を自動照合します。筆跡や書き順そのものの採点ではありません。</p>
</section>
<section class="panel" id="result">
  <div class="page-title" id="resultTitle">テスト結果</div>
  <div class="small" id="resultGrade"></div>
  <div class="result-score" id="score"></div>
  <div id="resultMessage"></div>
  <div class="result-list" id="resultList"></div>
  <div class="actions">
    <button class="primary" id="reviewWrong">まちがえた問題を復習する</button>
    <button class="secondary" id="retry">もう一度10問</button>
    <button class="secondary" id="backHome">学年選択へ</button>
  </div>
</section>
<section class="panel" id="review">
  <div class="page-title">まちがい復習</div>
  <p id="reviewIntro"></p>
  <div class="result-list" id="reviewResultList"></div>
  <div class="actions"><button class="secondary" id="reviewHome">学年選択へ</button></div>
</section>
</main>
<script>
// 令和2年度実施の学年別漢字配当表に基づく無料の漢字データAPIを利用します。
// 取得した公開漢字データは端末内(localStorage)に保存し、次回以降の通信を減らします。
const API='https://api.shirugear.com/kanji/v1/grade/';
const EXPECTED={1:80,2:160,3:200,4:202,5:193,6:191};
let grade=0, quiz=[], wrong=[], current=0, answers=[], mode='test', reviewQueue=[], bank=[];
const setup=document.getElementById('setup'), practice=document.getElementById('practice'), result=document.getElementById('result'), reviewPage=document.getElementById('review');
const promptEl=document.getElementById('prompt'), countEl=document.getElementById('count'), feedback=document.getElementById('feedback'), answerKanji=document.getElementById('answerKanji'), progressBar=document.getElementById('progressBar'), written=document.getElementById('writtenAnswer');
function showPage(page){[setup,practice,result,reviewPage].forEach(p=>p.style.display='none');page.style.display='block';}
function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function kana(s){return (s||'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));}
function normalize(s){return (s||'').normalize('NFKC').replace(/[\s　]/g,'').replace(/[。、，．]/g,'');}
function getReading(k){
  // 音読みを優先。APIが返すカタカナをひらがな表示に変換します。
  const on=(k.on||[]).find(x=>x && x.length>0);
  if(on)return kana(on);
  const kun=(k.kun||[]).find(x=>x && x.length>0);
  return kun||'読み';
}
async function loadBank(g){
  const key='kanjiQuestGradeData2020_v1_'+g;
  try{
    const cached=localStorage.getItem(key);
    if(cached){const parsed=JSON.parse(cached);if(parsed.length===EXPECTED[g])return parsed;}
  }catch(e){}
  const res=await fetch(API+g+'.json',{cache:'force-cache'});
  if(!res.ok)throw new Error('漢字データを取得できませんでした（'+res.status+'）');
  const data=await res.json();
  if(!data.kanji || data.kanji.length!==EXPECTED[g])throw new Error(g+'年生の漢字データ件数が一致しません。');
  const clean=data.kanji.map(k=>({grade:g,kanji:k.kanji,reading:getReading(k)})).filter(x=>x.kanji && x.reading!=='読み');
  if(clean.length!==EXPECTED[g])throw new Error(g+'年生の読みデータが不足しています。');
  try{localStorage.setItem(key,JSON.stringify(clean));}catch(e){}
  return clean;
}
async function chooseGrade(g){
  grade=g;const status=document.getElementById('count');status.textContent='漢字データを読み込み中…';
  document.querySelectorAll('[data-grade]').forEach(b=>b.disabled=true);
  try{
    const groups=await Promise.all(Array.from({length:g},(_,i)=>loadBank(i+1)));
    bank=groups.flat();startTest();
  }catch(err){
    status.textContent='';alert('漢字データを読み込めませんでした。インターネット接続を確認して、もう一度お試しください。\n'+err.message);
  }finally{document.querySelectorAll('[data-grade]').forEach(b=>b.disabled=false);}
}
function startTest(){quiz=shuffle(bank).slice(0,10);wrong=[];answers=[];current=0;mode='test';showPage(practice);document.getElementById('modeLabel').textContent='この読みの漢字を書こう';drawQuestion();}
function startReview(){if(!wrong.length)return;reviewQueue=shuffle(wrong);current=0;answers=[];mode='review';showPage(practice);document.getElementById('modeLabel').textContent='まちがえた漢字をもう一度';drawQuestion();}
function drawQuestion(){const list=mode==='test'?quiz:reviewQueue,q=list[current];promptEl.textContent=q.reading;countEl.textContent=`小学${grade}年生まで・${mode==='test'?'テスト':'復習'} ${current+1}/${list.length}`;progressBar.style.width=`${current/list.length*100}%`;written.value='';written.disabled=false;feedback.style.display='none';document.getElementById('check').disabled=false;setTimeout(()=>written.focus({preventScroll:true}),120);}
function judge(){if(feedback.style.display==='block')return;const q=(mode==='test'?quiz:reviewQueue)[current];const entered=normalize(written.value);if(!entered){alert('漢字を1字入力してね。Apple Pencilで入力欄に書くこともできるよ。');written.focus();return;}
 const correct=entered===q.kanji;
 answers.push({q,correct,entered});if(!correct&&mode==='test')wrong.push(q);
 document.getElementById('judgeLabel').textContent=correct?'正解！':'おしい！';answerKanji.textContent=q.kanji;
 document.getElementById('selfCheckText').textContent=correct?'正しい漢字が入力できたね！':`入力された字：「${written.value}」／正しい漢字：「${q.kanji}」`;
 feedback.style.display='block';written.disabled=true;document.getElementById('check').disabled=true;
}
function advance(){current++;const list=mode==='test'?quiz:reviewQueue;if(current>=list.length){if(mode==='test')showResults();else showReviewResults();}else drawQuestion();}
function showResults(){showPage(result);const correct=answers.filter(a=>a.correct).length;document.getElementById('resultTitle').textContent='10問テスト 結果';document.getElementById('resultGrade').textContent=`小学${grade}年生までの教育漢字`;
document.getElementById('score').textContent=`${correct} / 10 問正解`;document.getElementById('resultMessage').textContent=correct===10?'全問正解！すばらしい！':`${10-correct}問まちがえたよ。復習してみよう！`;
document.getElementById('resultList').innerHTML=answers.map((a,i)=>`<div class="result-item"><span>${i+1}. ${a.q.reading} → <strong>${a.q.kanji}</strong></span><strong class="${a.correct?'':'wrong'}">${a.correct?'正解':'まちがい'}</strong></div>`).join('');
document.getElementById('reviewWrong').disabled=wrong.length===0;document.getElementById('reviewWrong').textContent=wrong.length?`まちがえた${wrong.length}問を復習する`:'まちがいはありません';}
function showReviewResults(){showPage(reviewPage);const correct=answers.filter(a=>a.correct).length;document.getElementById('reviewIntro').textContent=`復習${answers.length}問中 ${correct}問正解！${answers.length-correct?`${answers.length-correct}問はまだまちがいです。`:'復習完了！よくがんばったね。'}`;
document.getElementById('reviewResultList').innerHTML=answers.map(a=>`<div class="result-item"><span>${a.q.reading} → <strong>${a.q.kanji}</strong></span><strong class="${a.correct?'':'wrong'}">${a.correct?'正解':'まちがい'}</strong></div>`).join('');wrong=answers.filter(a=>!a.correct).map(a=>a.q);
const old=document.getElementById('reviewAgain');if(old)old.remove();if(wrong.length){const b=document.createElement('button');b.id='reviewAgain';b.className='primary';b.textContent='残ったまちがいをもう一度';b.onclick=startReview;document.getElementById('reviewIntro').after(b);}}
function goHome(){countEl.textContent='';showPage(setup);}
document.querySelectorAll('[data-grade]').forEach(b=>b.addEventListener('click',()=>chooseGrade(Number(b.dataset.grade))));
document.getElementById('clear').onclick=()=>{written.value='';written.disabled=false;feedback.style.display='none';document.getElementById('check').disabled=false;written.focus();};
document.getElementById('check').onclick=judge;document.getElementById('nextQuestion').onclick=advance;written.addEventListener('keydown',e=>{if(e.key==='Enter'&&feedback.style.display!=='block')judge();});
document.getElementById('reviewWrong').onclick=startReview;document.getElementById('retry').onclick=startTest;document.getElementById('backHome').onclick=goHome;document.getElementById('reviewHome').onclick=goHome;document.getElementById('changeGrade').onclick=goHome;
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js');
</script>
</body></html>
